# ============================================================================
#  web01 VM  —  "public web server"
#  Deploy this folder on the web01 VM and run:  docker compose up -d
#
#  Host networking: each container binds straight to THIS VM's IP, so the
#  services answer on the VM's address with normal ports. Your Kali box scans
#  the VM's IP.
#
#    80/tcp   DVWA      (SQLi, XSS, upload, cmd injection)
#    21/tcp   FTP       (ftp/ftp + looted jsmith/backup, writable)
#    22/tcp   SSH       (root/root + looted jsmith/agarcia/backup)
#    5000/tcp Werkzeug  (Flask debug console, PIN=1234)
#    8080/tcp wp2shell  (WordPress 6.9.0: CVE-2026-63030 batch-route confusion,
#                       CVE-2026-60137 blind SQLi; admin/Summer2026!)
#
#  >>> PORT 22: the vulnerable SSH wants 22, which the VM's own sshd usually
#  >>> occupies. Free it first — set `Port 2222` in the VM's /etc/ssh/sshd_config
#  >>> (manage the VM on 2222), or run web01 headless from the hypervisor console.
# ============================================================================

services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    network_mode: host          # serves :80 (its bundled MySQL stays on localhost)
    restart: unless-stopped

  ftp:
    image: delfer/alpine-ftp-server
    container_name: ftp
    network_mode: host
    environment:
      USERS: "ftp|ftp|/ftp/ftp jsmith|password123 backup|letmein"
      ADDRESS: "REPLACE_WITH_WEB01_VM_IP"   # <-- this VM's LAN IP (passive FTP)
    volumes:
      - ./ftp:/ftp/ftp
    restart: unless-stopped

  ssh:
    image: rastasheep/ubuntu-sshd:18.04     # ships root/root (kept)
    container_name: ssh
    network_mode: host          # sshd on :22 — see the PORT 22 note above
    volumes:
      - ./ssh-setup.sh:/ssh-setup.sh:ro
    command: ["/bin/bash", "/ssh-setup.sh"] # adds jsmith/agarcia/backup
    restart: unless-stopped

  werkzeug:
    build: ./werkzeug
    image: lab-web01-werkzeug
    container_name: werkzeug
    network_mode: host          # Flask debug app on :5000, PIN=1234
    restart: unless-stopped

  # wp2shell lab, sourced from https://github.com/M4xSec/wp2shell-lab (the
  # no-WAF lab/ variant only). WordPress 6.9.0 auto-installs on first boot
  # (admin/Summer2026!); bridge network keeps its MariaDB off the VM's IP.
  wp2shell:
    build: ./wp2shell
    image: lab-web01-wp2shell
    container_name: wp2shell
    ports:
      - "8080:80"               # answers on the VM's IP via docker-proxy
    environment:
      WORDPRESS_DB_HOST: wp2shell-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    depends_on:
      wp2shell-db:
        condition: service_healthy
    volumes:
      - wp2shell_data:/var/www/html
    restart: unless-stopped

  wp2shell-db:
    image: mariadb:11.4
    container_name: wp2shell-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wp2shell_db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  wp2shell_data:
  wp2shell_db_data:
