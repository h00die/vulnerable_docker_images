me { name "irc.corp.local"; info "corp irc server"; numeric 1; };
admin { "root"; "root@corp.local"; "corp"; };
class clients { pingfreq 90; maxclients 500; sendq 100000; recvq 8000; };
class servers { pingfreq 90; maxclients 10; sendq 1000000; connfreq 100; };
allow { ip *@*; hostname *@*; class clients; maxperip 10; };
listen *:6667;
loadmodule "src/modules/cloak.so";
loadmodule "src/modules/commands.so";
set {
  kline-address root@corp.local;
  maxchannelsperuser 10;
  services-server services.corp.local;
  default-server irc.corp.local;
  network-name CorpNet;
  help-channel "#help";
  hiddenhost-prefix "corp";
  cloak-keys { "aR6xVb3nQ9pW2sD4fG"; "hJ8kL1zX5cV7bN0mQ3"; "wE4rT6yU8iO1pA3sD5f"; };
  hosts { global "irc.corp.local"; admin "admin.corp.local"; servicesadmin "services.corp.local"; netadmin "netadmin.corp.local"; coadmin "coadmin.corp.local"; };
};
