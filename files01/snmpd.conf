# Deliberately misconfigured SNMP: v1/v2c with default community strings.
# (No v3.) "public" is read-only, "private" is read-write, both over the
# entire MIB tree — the classic "nobody changed the defaults" setup.

agentAddress udp:0.0.0.0:161

# default community strings, exposed over the whole .1 subtree
rocommunity  public  default -V all
rwcommunity  private default -V all
view all included .1 80

# identifying info that leaks via standard OIDs (sysDescr/sysName/etc.)
sysLocation  Server Room B, Rack 4
sysContact   it-ops@corp.local
sysName      files01.corp.local
sysServices  72

# a juicy string reachable via NET-SNMP-EXTEND-MIB (snmpwalk it)
extend backupjob /bin/cat /etc/snmp/snmp-secret.txt
