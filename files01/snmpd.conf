# Deliberately misconfigured SNMP: v1/v2c with default community strings.
# (No v3.) "public" is read-only, "private" is read-write — the classic
# "nobody changed the defaults" setup.

agentaddress 161

# Default community strings over the entire MIB tree
rocommunity  public
rwcommunity  private

# Identifying info leaked via standard OIDs (sysDescr/sysName/etc.)
sysLocation  Server Room B, Rack 4
sysContact   it-ops@corp.local
sysName      files01.corp.local
sysServices  72

# Juicy string reachable via NET-SNMP-EXTEND-MIB (snmpwalk nsExtendOutputFull)
extend backupjob /bin/cat /etc/snmp/snmp-secret.txt
