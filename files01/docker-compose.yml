# ============================================================================
#  files01 VM  —  "internal file server"
#  Deploy this folder on the files01 VM and run:  docker compose up -d
#
#  Host networking matters here: NFS uses several dynamic RPC ports that are
#  painful to publish individually, so binding straight to the VM is cleanest.
#
#    2049,111,20048/tcp    NFS v3+v4 export /data (rw, no_root_squash, *)
#                           (local ./nfsd build — serves mountd so showmount works)
#    445,139/tcp           Samba "public"     (guest, writable)
#    6379/tcp              Redis              (no auth)
#    161/udp               SNMP v2c           (community public/private)
#    23/tcp                Juniper SSG5       (netscreen/netscreen + CVE-2015-7755 backdoor)
#    389/tcp               OpenLDAP           (anon bind, admin/ldapadmin, cleartext creds)
#    25/tcp                James SMTP 2.3.2   (CVE-2015-7611 path traversal → cron RCE)
#    110/tcp               James POP3         (same creds as LDAP users)
#    143/tcp               James IMAP         (same creds as LDAP users)
#    4555/tcp              James admin        (root/root)
#    623/udp               OpenIPMI BMC       (CVE-2013-4786 RAKP hash, CVE-2013-4782 cipher zero)
#    873/tcp               rsync              (anonymous, writable "backup" module)
#    69/udp                TFTP               (anonymous read/write — switch/firewall configs)
#    6667/tcp              UnrealIRCd 3.2.8.1 (CVE-2010-2075: "AB" lines → system())
#    27017/tcp             MongoDB 3.6        (no auth; zlib wire compression on → CVE-2025-14847 mongobleed)
#    11211/tcp+udp         memcached          (no auth; UDP left on)
#    9200/tcp              Elasticsearch 1.4.2 (no auth + CVE-2015-1427 Groovy RCE)
#
#  >>> The NFS box needs kernel NFS modules on the VM:  sudo modprobe nfs nfsd
#  >>> (make it persist — see README). Don't run the VM's own nfs-kernel-server.
# ============================================================================

services:
  nfs:
    build: ./nfsd
    image: lab-files01-nfsd
    container_name: nfs
    network_mode: host          # 2049 nfsd, 111 rpcbind, 20048 mountd, 32765 statd
    privileged: true
    volumes:
      - ./nfs:/data
    restart: unless-stopped

  smb:
    image: dperson/samba
    container_name: smb
    network_mode: host
    command:
      - "-p"
      - "-n"
      - "-u"
      - "guest;guest"
      - "-s"
      - "public;/share;yes;no;yes;all;none"
    volumes:
      - ./smb:/share
    restart: unless-stopped

  redis:
    image: redis:8.2.0
    container_name: redis
    network_mode: host
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no"]
    restart: unless-stopped

  snmp:
    build: ./snmpd
    image: lab-files01-snmpd
    container_name: snmp
    network_mode: host          # snmpd on UDP :161 (public/private communities)
    restart: unless-stopped

  juniper:
    build: ./juniper
    image: lab-files01-juniper
    container_name: juniper
    network_mode: host          # telnet :23 — Juniper SSG5 emulator
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  ldap:
    build: ./ldap
    image: lab-files01-ldap
    container_name: ldap
    network_mode: host          # ldap :389 — anonymous bind + weak admin creds
    cap_add:
      - NET_BIND_SERVICE
    environment:
      LDAP_ORGANISATION: "Corp"
      LDAP_DOMAIN: "corp.local"
      LDAP_ADMIN_PASSWORD: "ldapadmin"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "ldapro"
      LDAP_READONLY_USER_PASSWORD: "readonly123"
      LDAP_TLS: "false"
    command: ["--copy-service"]
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
    restart: unless-stopped

  james:
    build: ./james
    image: lab-files01-james
    container_name: james
    network_mode: host          # smtp :25  pop3 :110  imap :143  admin :4555
    restart: unless-stopped

  ipmi:
    build: ./ipmi
    image: lab-files01-ipmi
    container_name: ipmi
    network_mode: host          # udp :623 — IPMI 2.0 BMC (CVE-2013-4786, CVE-2013-4782)
    restart: unless-stopped

  rsyncd:
    build: ./rsyncd
    image: lab-files01-rsyncd
    container_name: rsyncd
    network_mode: host          # :873 — anonymous, listable, WRITABLE rsync module
    restart: unless-stopped

  tftp:
    build: ./tftp
    image: lab-files01-tftp
    container_name: tftp
    network_mode: host          # udp :69 — anonymous read/write (device configs w/ creds)
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  unrealircd:
    build: ./unrealircd
    image: lab-files01-unrealircd
    container_name: unrealircd
    network_mode: host          # :6667 — CVE-2010-2075: lines starting with AB → system()
    restart: unless-stopped

  mongo:
    image: mongo:3.6
    container_name: mongo
    network_mode: host          # :27017 — no auth, seeded intranet creds
    # zlib wire compression is NOT in 3.6's defaults (snappy only) — turn it on
    # so the CVE-2025-14847 (mongobleed) OP_COMPRESSED path is reachable.
    command: ["mongod", "--networkMessageCompressors", "zlib"]
    volumes:
      - ./mongo/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    network_mode: host          # :11211 tcp+udp — no auth (UDP re-enabled on purpose)
    command: ["memcached", "-U", "11211"]
    restart: unless-stopped

  elasticsearch:
    build: ./elasticsearch
    image: lab-files01-elasticsearch
    container_name: elasticsearch
    network_mode: host          # :9200 — no auth + CVE-2015-1427 Groovy RCE
    restart: unless-stopped
