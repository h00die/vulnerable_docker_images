# ============================================================================
#  app01 VM  —  "application server"
#  Deploy this folder on the app01 VM and run:  docker compose up -d
#
#    80/tcp    WordPress 4.6   (outdated core/plugins)
#    8080/tcp  Tomcat Manager  (admin/admin + tomcat/tomcat)
#    3306/tcp  MySQL           (root/root)
#    23/tcp    Brocade FWS624  (username/password, ttrogdon/ttrogdon, dmudd/crazypassword)
#    5432/tcp  PostgreSQL      (postgres/postgres → COPY FROM PROGRAM RCE)
#    3632/tcp  distccd         (unauth compile jobs → RCE, CVE-2004-2687)
#    3000/tcp  Grafana 8.0.0   (admin/admin + CVE-2021-43798 path traversal)
#
#  WordPress reaches the DB on 127.0.0.1:3306 (same VM via host networking).
#  Auto-installs on first boot with admin:admin and seeds lab users. No wizard needed.
# ============================================================================

services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    network_mode: host          # :3306 on the VM (root/root)
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "wordpress"
      MYSQL_USER: "wordpress"
      MYSQL_PASSWORD: "wordpress"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  wordpress:
    build: ./wordpress
    image: lab-app01-wordpress
    container_name: wordpress
    network_mode: host          # :80
    environment:
      WORDPRESS_DB_HOST: "127.0.0.1:3306"
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD: "wordpress"
      WORDPRESS_DB_NAME: "wordpress"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    'http://' . $_SERVER['HTTP_HOST']);
        define('WP_SITEURL', 'http://' . $_SERVER['HTTP_HOST']);
    volumes:
      - ./wp_seed_users.sql:/docker-entrypoint-initdb.d/wp_seed_users.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  tomcat:
    image: tomcat:9.0
    container_name: tomcat
    network_mode: host          # :8080
    volumes:
      - ./tomcat-setup.sh:/tomcat-setup.sh:ro
    command: ["/bin/bash", "/tomcat-setup.sh"]
    restart: unless-stopped

  brocade:
    build: ./brocade
    image: lab-app01-brocade
    container_name: brocade
    network_mode: host          # telnet :23 — Brocade FWS624/ICX6450 emulator
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  postgres:
    image: postgres:13-alpine
    container_name: postgres
    network_mode: host          # :5432 — postgres/postgres → COPY FROM PROGRAM RCE
    environment:
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    restart: unless-stopped

  distccd:
    build: ./distccd
    image: lab-app01-distccd
    container_name: distccd
    network_mode: host          # :3632 — unauth distcc → RCE (CVE-2004-2687)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:8.0.0
    container_name: grafana
    network_mode: host          # :3000 — admin/admin + CVE-2021-43798 path traversal
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    restart: unless-stopped
